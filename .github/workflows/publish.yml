name: Publish

on:
  push:
    branches: [main]
    paths: ["deno.json"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      - name: Resolve package name and version
        id: pkg
        run: |
          echo "name=$(jq -r .name deno.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version deno.json)" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already published
        id: check
        run: |
          if curl -fsS "https://jsr.io/${{ steps.pkg.outputs.name }}/meta.json" \
            | jq -e --arg v "${{ steps.pkg.outputs.version }}" '.versions | has($v)' > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on JSR; nothing to publish."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.check.outputs.needed == 'true'
        run: deno publish
